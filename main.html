<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Gear Solid - Waiting Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'PressStart2P';
            src: url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        }

        body {
            font-family: 'Courier New', monospace;
            background: #3a4a2c;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.12),
                rgba(0, 0, 0, 0.12) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            gap: 15px;
            min-height: 100vh;
        }

        /* HEADER SUPERIOR */
        .header-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #5a6b4c, #4a5a3c);
            border-bottom: 2px solid #2a3a1c;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid #000;
            padding: 5px 15px;
            background: #000;
            text-shadow: 1px 1px 0 #2a3a1c;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .gmp-display {
            background: #fff;
            color: #000;
            padding: 5px 15px;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 12px;
        }

        /* PANEL IZQUIERDO - LISTA DE STAFF */
        .left-panel {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 50px;
        }

        .panel {
            background: #e8e8e8;
            border: 3px solid #000;
            border-right: 5px solid #000;
            border-bottom: 5px solid #000;
            border-top: 2px solid #999;
            border-left: 2px solid #999;
            box-shadow: -4px 4px 0 rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            background: #000;
            color: #fff;
            padding: 8px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            border-bottom: 2px solid #666;
        }

        .staff-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
        }

        .staff-item {
            background: #e8e8e8;
            border: 1px solid #999;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            padding: 6px 8px;
            margin-bottom: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.1s;
            color: #000;
        }

        .staff-item:hover {
            background: #ffff00;
        }

        .staff-item.selected {
            background: #ff0000;
            color: #fff;
            border: 2px solid #000;
        }

        .staff-rank {
            background: #ddd;
            padding: 1px 4px;
            margin-right: 4px;
            font-size: 10px;
        }

        /* PANEL DERECHO */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 50px;
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            gap: 10px;
        }

        .character-box {
            flex: 0 0 280px;
            background: #888;
            border: 3px solid #000;
            border-right: 5px solid #000;
            border-bottom: 5px solid #000;
            border-top: 2px solid #ccc;
            border-left: 2px solid #ccc;
            box-shadow: -4px 4px 0 rgba(0, 0, 0, 0.3);
            padding: 0;
            overflow: hidden;
        }

        .character-name {
            background: #cc0000;
            color: #fff;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #000;
            letter-spacing: 1px;
        }

        .character-image {
            width: 100%;
            height: 240px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="%23666" stroke-width="1"/></pattern></defs><rect width="280" height="240" fill="%23888"/><rect width="280" height="240" fill="url(%23grid)"/><text x="140" y="120" font-family="monospace" font-size="14" fill="%23666" text-anchor="middle" dominant-baseline="middle">CLIC PARA CARGAR IMAGEN</text></svg>');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 11px;
        }

        .character-image:hover {
            opacity: 0.8;
        }

        .character-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Stats Box */
        .stats-box {
            background: #1a1a1a;
            border: 3px solid #000;
            border-right: 5px solid #000;
            border-bottom: 5px solid #000;
            border-top: 2px solid #555;
            border-left: 2px solid #555;
            box-shadow: -4px 4px 0 rgba(0, 0, 0, 0.3);
            padding: 8px;
        }

        .stat-item {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .stat-label {
            background: #cc0000;
            color: #fff;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #000;
            min-width: 60px;
            text-align: center;
        }

        .stat-input {
            flex: 1;
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 4px 6px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .stat-input:hover {
            background: #00ff00;
            color: #000;
        }

        .stat-input:focus {
            outline: none;
        }

        /* Bottom Section */
        .bottom-section {
            background: #000;
            border: 3px solid #000;
            border-top: 2px solid #555;
            border-left: 2px solid #555;
            box-shadow: inset 1px 1px 0 #555;
            padding: 10px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00ff00;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #cc0000;
            color: #fff;
            border: 2px solid #000;
            border-right: 4px solid #000;
            border-bottom: 4px solid #000;
            border-top: 2px solid #999;
            border-left: 2px solid #999;
            padding: 8px 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.1s;
            letter-spacing: 1px;
            box-shadow: -2px 2px 0 rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background: #ff3333;
            transform: translate(-1px, -1px);
            box-shadow: -3px 3px 0 rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            transform: translate(1px, 1px);
            box-shadow: -1px 1px 0 rgba(0, 0, 0, 0.3);
        }

        /* Call Screen */
        .call-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .call-screen.active {
            display: flex;
        }

        .call-box {
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .call-title {
            background: #cc0000;
            color: #fff;
            font-size: 56px;
            font-weight: bold;
            padding: 30px 50px;
            margin-bottom: 40px;
            border: 4px solid #fff;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0 #000;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 30px rgba(204, 0, 0, 0.9);
        }

        .call-instruction {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            animation: blink 0.8s infinite;
            text-shadow: 2px 2px 0 #cc0000;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.4; }
        }

        /* Scrollbar */
        .staff-list::-webkit-scrollbar {
            width: 14px;
        }

        .staff-list::-webkit-scrollbar-track {
            background: #c0c0c0;
        }

        .staff-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #e0e0e0, #808080);
            border: 1px solid #000;
        }

        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .left-panel, .right-panel {
                margin-top: 60px;
            }

            .profile-section {
                flex-direction: column;
            }

            .character-box {
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="header-top">
        <div class="header-title">STAFF</div>
        <div class="header-right">
            <div style="display: flex; gap: 10px; align-items: center; font-size: 12px;">
                <span>LIST MODE</span>
                <span>⬜▶ 🗋</span>
            </div>
            <div class="gmp-display">✕ GMP<br>0</div>
        </div>
    </div>

    <div class="main-container">
        <!-- Left Panel: Staff List -->
        <div class="left-panel">
            <div class="panel">
                <div class="panel-header">NAME</div>
                <div class="staff-list" id="staffList">
                    <div class="staff-item selected" data-name="ARTURO">
                        <span><span class="staff-rank">LND</span>ARTURO</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="EAGLE RAY">
                        <span><span class="staff-rank">NML</span>EAGLE RAY</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="CABBAGE WHITE">
                        <span><span class="staff-rank">NML</span>CABBAGE WHITE</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="PECCARY">
                        <span><span class="staff-rank">NML</span>PECCARY</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="OSTRICH">
                        <span><span class="staff-rank">NML</span>OSTRICH</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="FRILL SHARK">
                        <span><span class="staff-rank">NML</span>FRILL SHARK</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="BOBCAT">
                        <span><span class="staff-rank">NML</span>BOBCAT</span>
                        <span>📞</span>
                    </div>
                    <div class="staff-item" data-name="ALLIGATOR">
                        <span><span class="staff-rank">NML</span>ALLIGATOR</span>
                        <span>📞</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Profile and Stats -->
        <div class="right-panel">
            <div class="profile-section">
                <div class="character-box">
                    <div class="character-name" id="charName">ARTURO</div>
                    <div class="character-image" id="charImage" title="Clic para cargar imagen">
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="stats-box" style="flex: 1;">
                    <div style="color: #fff; text-align: center; margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #555; padding-bottom: 6px;">STATS</div>
                    <div class="stat-item">
                        <div class="stat-label">LIFE</div>
                        <input type="number" id="lifeInput" class="stat-input" value="7000" min="0">
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">PSYCHE</div>
                        <input type="number" id="psycheInput" class="stat-input" value="7000" min="0">
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div style="display: flex; gap: 8px;">
                    <span>!</span>
                    <span>DETAILS △</span>
                    <span style="margin-left: 10px;">HELP SELECT</span>
                </div>
                <div class="button-group">
                    <button class="btn" id="callBtn">CALL</button>
                    <button class="btn" onclick="window.location.href='/index.html'">CODEC</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Call Screen -->
    <div class="call-screen" id="callScreen">
        <div class="call-box">
            <div class="call-title">CALL</div>
            <div class="call-instruction">HAZ CLICK PARA RESPONDER</div>
        </div>
    </div>

    <script>
        const staffItems = document.querySelectorAll('.staff-item');
        const charName = document.getElementById('charName');
        const charImage = document.getElementById('charImage');
        const imageInput = document.getElementById('imageInput');
        const callBtn = document.getElementById('callBtn');
        const callScreen = document.getElementById('callScreen');

        // Staff selection
        staffItems.forEach(item => {
            item.addEventListener('click', function() {
                staffItems.forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
                const name = this.getAttribute('data-name');
                charName.textContent = name;
                charImage.style.backgroundImage = 'none';
                charImage.innerHTML = '<input type="file" id="imageInput" accept="image/*" style="display: none;">';
            });
        });

        // Image upload
        charImage.addEventListener('click', function() {
            imageInput.click();
        });

        document.addEventListener('change', function(e) {
            if (e.target.type === 'file' && e.target.accept === 'image/*') {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        charImage.style.backgroundImage = 'url(' + event.target.result + ')';
                        charImage.style.backgroundSize = 'cover';
                        charImage.style.backgroundPosition = 'center';
                        charImage.innerHTML = '';
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        // Call button
        callBtn.addEventListener('click', function() {
            callScreen.classList.add('active');
            
            // Try to play audio
            const audio = document.querySelector('audio');
            if (audio) {
                audio.play().catch(err => console.log('[v0] Audio:', err));
            }

            // Click to proceed
            setTimeout(function() {
                callScreen.addEventListener('click', function() {
                    window.location.href = '/index.html';
                }, { once: true });
            }, 100);
        });
    </script>
</body>
</html>
