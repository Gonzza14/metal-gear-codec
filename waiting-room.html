<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Gear - Waiting Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 100%);
            font-family: 'Courier New', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23333" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="%235a5a5a"/><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            border: 3px solid #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 20px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #000;
            padding-bottom: 15px;
        }

        .header-left {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            padding: 10px 20px;
            background: #000;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 20px;
        }

        .gmp-display {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border: 2px solid #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .staff-list {
            grid-column: 1 / 2;
        }

        .staff-list h3 {
            background: #fff;
            color: #000;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #000;
        }

        .staff-item {
            background: #f0f0f0;
            color: #000;
            padding: 8px 10px;
            margin-bottom: 5px;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .staff-item.selected {
            background: #cc0000;
            color: #fff;
            font-weight: bold;
        }

        .staff-item-name {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .staff-icon {
            width: 16px;
            height: 16px;
            background: #000;
            border: 1px solid #000;
        }

        .staff-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            background: #fff;
        }

        .character-display {
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #333;
            border: 3px solid #000;
            padding: 20px;
        }

        .character-image {
            width: 180px;
            height: 200px;
            background: #555;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 15px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23555" width="100" height="100"/><circle cx="50" cy="35" r="15" fill="%23777"/><ellipse cx="50" cy="65" rx="20" ry="25" fill="%23777"/></svg>');
            background-size: cover;
        }

        .character-name {
            background: #cc0000;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            border: 2px solid #000;
        }

        .stats-panel {
            grid-column: 3 / 4;
        }

        .stat-box {
            background: #000;
            border: 3px solid #cc0000;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .stat-label {
            background: #cc0000;
            color: #fff;
            padding: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        .stat-value {
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            min-width: 80px;
            text-align: right;
        }

        .stat-input {
            background: #333;
            color: #fff;
            border: 2px solid #cc0000;
            padding: 5px 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            width: 80px;
            text-align: right;
            margin-left: 10px;
        }

        .gmp-display-panel {
            background: #fff;
            color: #000;
            padding: 15px;
            border: 3px solid #000;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gmp-label {
            font-size: 14px;
        }

        .gmp-value {
            font-size: 24px;
        }

        .bottom-info {
            background: #000;
            color: #fff;
            padding: 12px;
            border: 2px solid #000;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-text {
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background: #cc0000;
            color: #fff;
            border: 3px solid #000;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .call-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .call-screen.active {
            display: flex;
        }

        .call-content {
            text-align: center;
        }

        .call-title {
            background: #cc0000;
            color: #000;
            padding: 20px;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 40px;
            border: 4px solid #fff;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
        }

        .call-instruction {
            color: #fff;
            font-size: 36px;
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .staff-list {
                grid-column: 1;
            }

            .character-display {
                grid-column: 1;
            }

            .stats-panel {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">STAFF</div>
            <div class="header-right">
                <div class="gmp-display">
                    <span>✕ GMP</span>
                    <span id="gmp-header">50000</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="staff-list">
                <h3>NAME</h3>
                <div class="staff-item selected">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>ARTURO</span>
                    </div>
                    <div class="staff-checkbox" style="background: #cc0000;"></div>
                </div>
                <div class="staff-item">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>SOLDADO 1</span>
                    </div>
                    <div class="staff-checkbox"></div>
                </div>
                <div class="staff-item">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>SOLDADO 2</span>
                    </div>
                    <div class="staff-checkbox"></div>
                </div>
                <div class="staff-item">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>SOLDADO 3</span>
                    </div>
                    <div class="staff-checkbox"></div>
                </div>
                <div class="staff-item">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>SOLDADO 4</span>
                    </div>
                    <div class="staff-checkbox"></div>
                </div>
                <div class="staff-item">
                    <div class="staff-item-name">
                        <span class="staff-icon"></span>
                        <span>SOLDADO 5</span>
                    </div>
                    <div class="staff-checkbox"></div>
                </div>
            </div>

            <div class="character-display">
                <div class="character-image" id="character-image-placeholder"></div>
                <div class="character-name">ARTURO</div>
            </div>

            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">LIFE</div>
                    <div class="stat-value">
                        <span class="stat-number" id="life-value">7000</span>
                        <input type="number" class="stat-input" id="life-input" value="7000" min="0" max="9999">
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">PSYCHE</div>
                    <div class="stat-value">
                        <span class="stat-number" id="psyche-value">7000</span>
                        <input type="number" class="stat-input" id="psyche-input" value="7000" min="0" max="9999">
                    </div>
                </div>
                <div class="gmp-display-panel">
                    <span>GMP+ </span>
                    <span id="gmp-value">7875</span>
                </div>
            </div>
        </div>

        <div class="bottom-info">
            <span class="info-text">You can increase the number of staff through Fulton recoveries during missions.</span>
            <span>DETAILS △ HELP select</span>
        </div>

        <div class="button-group">
            <button class="btn" onclick="goToCodec()">Start Codec</button>
            <button class="btn" onclick="resetStats()">Reset</button>
        </div>
    </div>

    <div class="call-screen" id="call-screen">
        <div class="call-content">
            <div class="call-title">CALL</div>
            <div class="call-instruction">HAZ CLICK PARA RESPONDER</div>
        </div>
    </div>

    <script>
        // Update stat displays
        document.getElementById('life-input').addEventListener('change', function() {
            document.getElementById('life-value').textContent = this.value;
        });

        document.getElementById('psyche-input').addEventListener('change', function() {
            document.getElementById('psyche-value').textContent = this.value;
        });

        function resetStats() {
            document.getElementById('life-input').value = 7000;
            document.getElementById('psyche-input').value = 7000;
            document.getElementById('life-value').textContent = 7000;
            document.getElementById('psyche-value').textContent = 7000;
        }

        function goToCodec() {
            const callScreen = document.getElementById('call-screen');
            callScreen.classList.add('active');
            
            // Play audio with muted attribute (allowed autoplay)
            const audio = new Audio('codec.mp3');
            audio.muted = false;
            audio.play().catch(function(err) {
                console.log('[v0] Audio playback prevented:', err);
            });

            // Wait for click to proceed to codec
            document.addEventListener('click', proceedToCodec, { once: true });
        }

        function proceedToCodec() {
            // Redirect to codec page
            window.location.href = '/index.html?codec=true';
        }

        // Allow character image upload
        document.getElementById('character-image-placeholder').addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('character-image-placeholder').style.backgroundImage = 'url(' + event.target.result + ')';
                    };
                    reader.readAsDataURL(file);
                }
            });
            input.click();
        });
    </script>
</body>
</html>
